<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="50%" stop-color="#167a5b" />
      <stop offset="100%" stop-color="#0a4433" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Liquid Glass Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="130" fill="url(#bgGrad)" filter="url(#glassShadow)" />
  
  <!-- Specular 3D Glass Bevel Rim Highlight -->
  <rect x="28" y="28" width="456" height="456" rx="126" fill="none" stroke="url(#innerGlow)" stroke-width="8" />

  <!-- Code Debug Symbol: Magnifying Lens + Python/Code Brackets -->
  <circle cx="230" cy="230" r="110" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />
  <line x1="312" y1="312" x2="410" y2="410" stroke="#ffffff" stroke-width="40" stroke-linecap="round" />
  
  <!-- Left code bracket < -->
  <path d="M 210 185 L 175 230 L 210 275" fill="none" stroke="#6ee7b7" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right code bracket > -->
  <path d="M 250 185 L 285 230 L 250 275" fill="none" stroke="#6ee7b7" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <!-- AI Center Neural Spark Dot -->
  <circle cx="230" cy="230" r="14" fill="#ffffff" />
</svg>